<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="same-origin">
  <title>Вхід · Поклик Ктулху</title>
  <style>
    :root { color-scheme: dark; font: 17px/1.5 system-ui, sans-serif; color: #f3eade; background: #18211b; }
    body { margin: 0; display: grid; place-items: center; min-height: 100vh; }
    main { box-sizing: border-box; width: min(100% - 2rem, 38rem); padding: 2rem; border: 1px solid #706750; border-radius: .8rem; background: #202922; }
    h1 { margin: 0 0 1rem; font: 600 2rem/1.2 Georgia, serif; }
    p { margin: 0 0 1rem; }
    a, button { display: inline-block; border: 1px solid #ddc290; border-radius: .4rem; padding: .55rem .9rem; background: #ddc290; color: #18211b; font: inherit; text-decoration: none; cursor: pointer; }
    #dashboard-nav { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
    #dashboard-nav button[aria-pressed="false"] { background: transparent; color: #f3eade; }
    #rooms, #admin, #keeper { margin-top: 1.6rem; border-top: 1px solid #706750; padding-top: 1rem; }
    #rooms form { margin-bottom: 1rem; }
    #rooms label { display: block; margin-top: .45rem; }
    #rooms input { box-sizing: border-box; display: block; width: 100%; padding: .45rem; margin-bottom: .65rem; font: inherit; }
    #rooms li { margin: .6rem 0; overflow-wrap: anywhere; }
    [hidden] { display: none; }
    :focus-visible { outline: 2px solid #f3eade; outline-offset: 3px; }
  </style>
  <script type="module" src="./session.js"></script>
</head>
<body>
  <main>
    <h1>Поклик Ктулху</h1>
    <p id="status" role="status">Перевіряємо вхід…</p>
    <a id="google-login" href="/api/migration/auth/google" hidden>Увійти через Google</a>
    <form id="logout" method="post" action="/api/migration/auth/logout" hidden>
      <button type="submit">Вийти</button>
    </form>
    <nav id="dashboard-nav" aria-label="Кабінети" hidden>
      <button type="button" data-view="rooms" aria-pressed="true">Кабінет гравця</button>
      <button type="button" data-view="keeper" aria-pressed="false" hidden>Кабінет ведучого</button>
      <button type="button" data-view="admin" aria-pressed="false" hidden>Адміністрування</button>
    </nav>
    <section id="rooms" aria-labelledby="rooms-title" hidden>
      <h2 id="rooms-title">Мої кімнати</h2>
      <p id="rooms-status" role="status"></p>
      <ul id="room-list"></ul>
      <section id="room-detail" aria-label="Учасники кімнати" hidden></section>
      <form id="join-room">
        <label for="room-code">Код запрошення</label>
        <input id="room-code" name="code" required maxlength="20" autocomplete="off">
        <button>Приєднатися</button>
      </form>
    </section>
    <section id="keeper" aria-labelledby="keeper-title" hidden>
      <h2 id="keeper-title">Кабінет ведучого</h2>
      <p id="keeper-status" role="status"></p>
      <ul id="keeper-rooms"></ul>
      <form id="create-room">
        <label for="room-title">Назва кімнати</label>
        <input id="room-title" name="title" required maxlength="100">
        <label for="room-description">Опис (необов’язково)</label>
        <input id="room-description" name="description" maxlength="1000">
        <button>Створити кімнату</button>
      </form>
    </section>
    <section id="admin" aria-labelledby="admin-title" hidden>
      <h2 id="admin-title">Адміністрування</h2>
      <p id="admin-status" role="status"></p>
      <h3>Кімнати сайту</h3>
      <ul id="admin-rooms"></ul>
      <h3>Акаунти й ролі</h3>
      <ul id="admin-accounts"></ul>
    </section>
  </main>
</body>
</html>
